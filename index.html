<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #f8f9fa, #e0f7fa);
      margin: 0;
      padding: 50px;
    }

    h1 {
      color: #00796b;
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #333;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background-color: #009688;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #00796b;
      transform: scale(1.05);
    }

    .result {
      background-color: white;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      border-radius: 12px;
      font-size: 20px;
      color: #333;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <h1>🪨📄✂️ Rock Paper Scissors</h1>
  <p>Make your move!</p>

  <div class="button-group">
    <button onclick="task('rock')">🪨 Rock</button>
    <button onclick="task('paper')">📄 Paper</button>
    <button onclick="task('scissors')">✂️ Scissors</button>
  </div>

  <div class="result" id="result">Your result will appear here.</div>

  <script src = "index.js">
  </script>

</body>
</html>
